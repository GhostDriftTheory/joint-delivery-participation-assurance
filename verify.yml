name: Joint delivery assurance verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joint-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Python, JavaScript and source consistency
        run: python poc.py ci
      - name: Generate and independently verify the standard suite
        run: |
          python poc.py run
          python poc.py verify output/results.json
      - name: Set up browser tests
        if: matrix.python == '3.12'
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser operations, local file and HTTP entrypoints
        if: matrix.python == '3.12'
        run: python poc.py browser-test
      - name: Install the pinned Lean toolchain
        if: matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
      - name: Lean proofs, raw-input conformance and proof dependencies
        if: matrix.python == '3.12'
        run: python poc.py lean-test
